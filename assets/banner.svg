<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
<title id="title">Hi, I&#x27;m Henrique. I build digital experiences.</title>
<desc id="desc">Web Developer, Creative Solutions and Founder of HenrStudio. Brazilian developer based in Portugal.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1416"/>
    <stop offset="1" stop-color="#182524"/>
  </linearGradient>
  <linearGradient id="line">
    <stop stop-color="#9BD9A5"/>
    <stop offset="1" stop-color="#6FAF91" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
  .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
  .intro { animation: reveal .8s ease-out both; }
  .headline { animation: reveal 1s .15s ease-out both; }
  .subtitle { animation: reveal 1s .3s ease-out both; }
  .cursor { animation: blink 1.4s 3; }
  .signal { animation: travel 4s ease-in-out 3; }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    0%, 45%, 100% { opacity: .65; }
    50%, 90% { opacity: .05; }
  }
  @keyframes travel {
    from { stroke-dashoffset: 120; opacity: .2; }
    50% { opacity: .7; }
    to { stroke-dashoffset: 0; opacity: .2; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
<rect x="1" y="1" width="958" height="418" rx="24"
      fill="url(#bg)" stroke="#365048"/>
<path d="M48 78H912" stroke="#365048"/>
<text x="48" y="49" font-size="19" font-weight="600"
      letter-spacing="1.5" fill="#9BD9A5">HENRSTUDIO</text>
<text x="912" y="48" text-anchor="end" class="mono"
      font-size="13" fill="#A9BDB5">DESIGN / CODE / PURPOSE</text>

<g fill="none" stroke="#6FAF91" opacity=".35">
  <rect x="762" y="119" width="124" height="124" rx="22"/>
  <rect x="788" y="145" width="124" height="124" rx="22"/>
  <path d="M806 180L791 195L806 210M863 180L878 195L863 210"/>
  <path d="M841 174L827 218"/>
  <circle cx="885" cy="126" r="5" fill="#9BD9A5"/>
</g>

<text x="48" y="140" font-size="38" fill="#F1F5F3"
      class="intro">Hi, I'm Henrique.</text>
<g class="headline" fill="#F1F5F3" font-size="64"
   font-weight="650" letter-spacing="-2">
  <text x="45" y="219">I build digital</text>
  <text x="45" y="292" fill="#9BD9A5">experiences.</text>
</g>
<rect x="453" y="243" width="3" height="53" rx="1.5"
      fill="#9BD9A5" opacity=".65" class="cursor"/>

<text x="48" y="344" font-size="17" fill="#A9BDB5"
      class="subtitle">Web Developer · Creative Solutions · Founder of HenrStudio</text>
<path d="M48 377H912" stroke="url(#line)"/>
<path d="M48 377H912" stroke="#9BD9A5"
      stroke-dasharray="12 108" opacity=".2" class="signal"/>
<text x="912" y="399" text-anchor="end" class="mono"
      font-size="11" letter-spacing="1" fill="#A9BDB5">BASED IN PORTUGAL</text>

</svg>
